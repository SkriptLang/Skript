name: Cleanup nightly documentation

on: delete

jobs:
  nightly-docs-cleanup:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Configure workflow
        id: configuration
        env:
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
          BRANCH_NAME="${DELETED_BRANCH#refs/*/}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "DOCS_OUTPUT_DIR=${GITHUB_WORKSPACE}/docs/src/assets/syntaxes/" >> $GITHUB_OUTPUT
      - name: Checkout docs
        uses: actions/checkout@v6
        with:
          repository: "Skriptlang/docs"
          path: docs
          token: ${{ secrets.DOCS_TOKEN }}
      - name: Cleanup nightly documentation
        env:
          BRANCH_NAME: ${{ steps.configuration.outputs.BRANCH_NAME }}
          DOCS_DIR: ${{ steps.configuration.outputs.DOCS_OUTPUT_DIR }}
        run: |
          cd "${DOCS_DIR}"
          src_file="${BRANCH_NAME//\//-}.json"
          rm -rf ${src_file} || true
      - name: Push nightly documentation cleanup
        uses: ./skript/.github/workflows/docs/push-docs
        with:
          docs_repo_dir: ${{ steps.configuration.outputs.DOCS_REPO_DIR }}
          docs_repo_branch: "main"
          git_name: Nightly Docs Bot
          git_email: nightlydocs@skriptlang.org
          git_commit_message: "Delete ${{ steps.configuration.outputs.BRANCH_NAME }} branch nightly docs"
